services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expenses
      POSTGRES_PASSWORD: expenses
      POSTGRES_DB: expenses
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expenses -d expenses"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://expenses:expenses@db:5432/expenses
      SECRET_KEY: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      UPLOAD_DIR: /app/uploads
      MAIL_OUTBOX_DIR: /app/mail_outbox
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/mail_outbox:/app/mail_outbox
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
